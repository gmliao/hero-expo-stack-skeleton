# CI: client checks, client unit, backend unit, backend integration, Playwright console check, Web E2E.
# Covers: check:client:ui, check:expo, test:client, test:backend:unit, test:backend, check:web, check:pw:console, e2e:web.
# Mobile E2E (e2e:ios) is not run in CI; run locally before merging when feature touches mobile.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

env:
  FIREBASE_PROJECT_ID: hero-stack-local

jobs:
  client-checks-and-unit:
    runs-on: ubuntu-latest
    name: Client checks + Unit + Web bundle
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock', 'apps/client/bun.lock') }}
          restore-keys: |
            bun-
      - name: Install root
        run: bun install --frozen-lockfile
      - name: Install client
        run: cd apps/client && bun install --frozen-lockfile
      - name: Client UI boundary check
        run: bun run check:client:ui
      - name: Prepare .env for check:expo
        run: cp .env.example .env
      - name: Expo / type check
        run: bun run check:expo
        env:
          CI: 1
      - name: Client unit tests (with coverage)
        run: |
          cd apps/client && bun run test -- --coverage 2>&1 | tee /tmp/jest-out.txt
          exit_code=${PIPESTATUS[0]}
          if [ $exit_code -ne 0 ]; then
            echo ""
            echo "::group::❌ Test / Coverage failures"
            grep -E "^(FAIL |Jest:|●|✕ )" /tmp/jest-out.txt || true
            echo "::endgroup::"
            grep -E "^Jest:" /tmp/jest-out.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            grep "^FAIL " /tmp/jest-out.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $exit_code
      - name: Web bundle check
        run: bun run check:web
      - name: Upload client coverage
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage
          path: apps/client/coverage/
          retention-days: 7

  playwright-console:
    runs-on: ubuntu-latest
    name: Playwright console (no console.error)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock', 'apps/client/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: cd apps/client && bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: bunx playwright install --with-deps chromium
      - name: Playwright console check
        run: bun run check:pw:console
        env:
          CI: 1
          EXPO_PUBLIC_USE_EMULATOR: "false"
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: hero-stack-local
          EXPO_PUBLIC_FIREBASE_API_KEY: demo-api-key
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: hero-stack-local.firebaseapp.com

  backend-unit:
    runs-on: ubuntu-latest
    name: Backend unit
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock', 'backend/firebase/functions/bun.lock') }}
          restore-keys: |
            bun-
      - run: bun install --frozen-lockfile
      - run: cd backend/firebase/functions && bun install --frozen-lockfile && bun run build
      - run: bun run test:backend:unit
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/firebase/functions/coverage/
          retention-days: 7

  backend-integration:
    runs-on: ubuntu-latest
    name: Backend integration (emulator)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock', 'backend/firebase/functions/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('backend/firebase/firebase.json') }}
      - run: bun install --frozen-lockfile
      - run: cd backend/firebase/functions && bun install --frozen-lockfile && bun run build
      - run: bun run test:backend
        env:
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          GCLOUD_PROJECT: hero-stack-local

  web-e2e:
    runs-on: ubuntu-latest
    name: Web E2E (Playwright + emulators)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock', 'apps/client/bun.lock', 'backend/firebase/functions/bun.lock') }}
          restore-keys: |
            bun-
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('backend/firebase/firebase.json') }}
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: cd apps/client && bun install --frozen-lockfile
      - run: cd backend/firebase/functions && bun install --frozen-lockfile && bun run build
      - run: cp .env.example .env
      - run: bunx playwright install --with-deps chromium
      - name: Web E2E (emulators:exec + seed + Playwright)
        run: bun run e2e:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
